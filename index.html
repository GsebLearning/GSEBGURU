function loadAll() {
  try {
    const s = localStorage.getItem(STORE);
    if (s) Object.assign(data, JSON.parse(s));
  } catch(e) {}
  try {
    const n = JSON.parse(localStorage.getItem("gseb_names") || "{}");
    if (n.title) document.getElementById("siteTitle").textContent = n.title;
    if (n.subtitle) document.getElementById("siteSubtitle").textContent = n.subtitle;
    if (n.footer) document.getElementById("footerTitle").textContent = n.footer;
    if (n.footerSub) document.getElementById("footerSub").textContent = n.footerSub;
  } catch(e) {}
}
function saveData() {
  try { localStorage.setItem(STORE, JSON.stringify(data)); } catch(e) {}
}

document.getElementById("mainHeader").addEventListener("click", function() {
  if (isUnlocked) return;
  clickCount++;
  if (clickCount >= CLICKS) {
    clickCount = 0;
    document.getElementById("passModal").classList.remove("hidden");
    document.getElementById("passInput").value = "";
    document.getElementById("passError").classList.add("hidden");
  }
});

function closePassModal() {
  document.getElementById("passModal").classList.add("hidden");
}
function checkPassword() {
  if (document.getElementById("passInput").value === PASSWORD) {
    isUnlocked = true;
    localStorage.setItem(UNLOCK, "true");
    applyUnlock();
    closePassModal();
  } else {
    document.getElementById("passError").classList.remove("hidden");
  }
}
document.getElementById("passInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") checkPassword();
});

  document.getElementById("appBody").classList.remove("locked");

function getNotes(key, ci) {
  try {
    const all = JSON.parse(localStorage.getItem(NOTES) || "{}");
    return all[key + "-" + ci] || (data[key] && data[key].chapters[ci] && data[key].chapters[ci].notes) || "";
  } catch(e) { return ""; }
}
function saveNotes(key, ci, text) {
  try {
    const all = JSON.parse(localStorage.getItem(NOTES) || "{}");
    all[key + "-" + ci] = text;
    localStorage.setItem(NOTES, JSON.stringify(all));
  } catch(e) {}
}

function generate25(qs, name) {
  const pool = (qs || []).slice();
  while (pool.length < 25) {
    const b = (qs && qs[pool.length % Math.max(qs.length,1)]) || {type:"MCQ", text: name + " સંબંધિત પ્રશ્ન", answer:"પાઠ્યપુસ્તક"};
    pool.push({type: b.type||"MCQ", text: b.text + " (Q"+(pool.length+1)+")", answer: b.answer||"—"});
  }
  for (let i = pool.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0,25).map(function(q,i) {
    return {
      type: q.type, text: q.text, answer: q.answer,
      options: q.type === "MCQ" ? shuffle([q.answer||"સાચો", "વિકલ્પ A", "વિકલ્પ B", "વિકલ્પ C"]) : null
    };
  });
}
function shuffle(a) {
  for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function startTest(key, ci) {
  const ch = data[key].chapters[ci];
  currentTest = {key, ci, questions: generate25(ch.questions, ch.name), userAnswers: new Array(25).fill(null), submitted: false};
  document.getElementById("testTitle").textContent = "📝 25 Marks – " + ch.name;
  document.getElementById("testResult").classList.add("hidden");
  document.getElementById("testBody").classList.remove("hidden");
  document.getElementById("testActions").classList.remove("hidden");
  document.getElementById("submitBtn").classList.remove("hidden");
  renderTest();
  document.getElementById("testModal").classList.remove("hidden");
}
function renderTest() {
  const qs = currentTest.questions;
  let html = "";
  qs.forEach(function(q, i) {
    html += '<div style="margin-bottom:16px;padding:12px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;">';
    html += '<div style="margin-bottom:8px;"><b style="color:#4f46e5;">Q'+(i+1)+'.</b> <span style="font-size:11px;background:#e0e7ff;padding:2px 8px;border-radius:999px;">'+q.type+' • 1 ગુણ</span></div>';
    html += '<p style="margin-bottom:10px;white-space:pre-wrap;">'+q.text+'</p>';
    if (q.options) {
      q.options.forEach(function(opt) {
        const sel = currentTest.userAnswers[i] === opt ? " selected" : "";
        html += '<div class="test-option'+sel+'" onclick="selectOpt('+i+', this)">'+opt+'</div>';
      });
    } else {
      html += '<textarea rows="2" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;" placeholder="જવાબ લખો..." onchange="currentTest.userAnswers['+i+']=this.value">'+(currentTest.userAnswers[i]||"")+'</textarea>';
    }
    html += '</div>';
  });
  document.getElementById("testBody").innerHTML = html;
  document.getElementById("testProgress").textContent = "કુલ 25 પ્રશ્નો • દરેક 1 ગુણ";
}
function selectOpt(i, el) {
  if (currentTest.submitted) return;
  currentTest.userAnswers[i] = el.textContent;
  renderTest();
}
function submitTest() {
  if (!currentTest || currentTest.submitted) return;
  currentTest.submitted = true;
  let score = 0;
  currentTest.questions.forEach(function(q, i) {
    const ua = (currentTest.userAnswers[i]||"").toString().trim().toLowerCase();
    const ca = (q.answer||"").toString().trim().toLowerCase();
    if (ua && (ua === ca || ca.indexOf(ua) >= 0 || ua.indexOf(ca.split(" ")[0]) >= 0)) score++;
  });
  document.getElementById("testBody").classList.add("hidden");
  document.getElementById("submitBtn").classList.add("hidden");
  const res = document.getElementById("testResult");
  res.classList.remove("hidden");
  let msg = "", col = "";
  if (score >= 22) { msg = "ઉત્તમ! 🌟"; col = "#16a34a"; fireConfetti(true); }
  else if (score >= 18) { msg = "ખૂબ સારું! 👍"; col = "#059669"; fireConfetti(false); }
  else if (score >= 12) { msg = "સારું!"; col = "#d97706"; }
  else { msg = "ફરી અભ્યાસ કરો"; col = "#dc2626"; }
  res.innerHTML = '<div style="font-size:48px;margin-bottom:12px;">'+(score>=18?"🎉":"📚")+'</div><h3 style="font-size:28px;color:'+col+';">'+score+' / 25</h3><p style="font-size:18px;margin:10px 0;">'+msg+'</p><button class="btn" style="background:#4f46e5;color:white;margin-top:16px;" onclick="startTest(currentTest.key,currentTest.ci)">ફરી Test</button>';
}
function fireConfetti(big) {
  if (typeof confetti !== "function") return;
  const end = Date.now() + (big ? 3500 : 2000);
  (function frame() {
    confetti({particleCount: big?6:3, angle:60, spread:90, origin:{x:0}});
    confetti({particleCount: big?6:3, angle:120, spread:90, origin:{x:1}});
    if (Date.now() < end) requestAnimationFrame(frame);
  })();
}
function closeTest() {
  document.getElementById("testModal").classList.add("hidden");
  currentTest = null;
}

function render() {
  if (currentSub === "key") {
    renderKey();
    return;
  }
  const key = currentStd + "-" + currentSub;
  const section = data[key] || {title: "મટિરિયલ", chapters: []};
  let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">';
  html += '<h2 style="font-size:20px;font-weight:700;color:'+(section.color||"#4f46e5")+'">'+section.title+'</h2>';
  html += '<button class="edit-only btn" style="background:#4f46e5;color:white;" onclick="openAddModal()">➕ નવો પ્રશ્ન</button></div>';
  html += '<p style="font-size:13px;color:#64748b;margin-bottom:14px;">કુલ પ્રકરણો: <b>'+section.chapters.length+'</b></p>';

  section.chapters.forEach(function(ch, ci) {
    const notes = getNotes(key, ci);
    html += '<div class="card chapter">';
    html += '<div class="chapter-head" onclick="toggleChap(this)"><span>'+ch.name+'</span><span style="font-size:18px;">▼</span></div>';
    html += '<div class="chapter-body hidden" style="padding:14px;">';

    (ch.questions||[]).forEach(function(q, qi) {
      const colors = {"MCQ":"#dbeafe","ખાલી જગ્યા":"#d1fae5","ટૂંકા જવાબ":"#ede9fe","તફાવત":"#fef3c7","વૈજ્ઞાનિક કારણ":"#ffe4e6","HOTS":"#fce7f3","પ્રવૃત્તિ":"#cffafe","મને ઓળખો":"#ecfccb"};
      const bg = colors[q.type] || "#f1f5f9";
      html += '<div class="q-card"><span class="badge" style="background:'+bg+';">'+q.type+'</span>';
      html += '<div style="white-space:pre-wrap;margin-bottom:6px;">'+q.text+'</div>';
      html += '<button onclick="this.nextElementSibling.classList.toggle(\'hidden\')" style="font-size:13px;color:#059669;background:none;border:none;cursor:pointer;font-weight:600;">🔑 જવાબ જુઓ</button>';
      html += '<div class="answer-box hidden">'+(q.answer||"—")+'</div>';
      html += '<div class="edit-only" style="margin-top:8px;display:flex;gap:8px;">';
      html += '<button class="btn" style="background:#fbbf24;font-size:12px;padding:6px 12px;" onclick="editQ(\''+key+'\','+ci+','+qi+')">✏️ Edit</button>';
      html += '<button class="btn" style="background:#ef4444;color:white;font-size:12px;padding:6px 12px;" onclick="delQ(\''+key+'\','+ci+','+qi+')">🗑️</button>';
      html += '</div></div>';
    });

    html += '<div style="margin-top:16px;padding:12px;background:#fffbeb;border-radius:12px;border:1px solid #fcd34d;">';
    html += '<h4 style="color:#92400e;margin-bottom:6px;">📌 Notes</h4>';
    html += '<div id="nv-'+key+'-'+ci+'" style="font-size:13px;">'+(notes||"નોંધ નથી")+'</div>';
    html += '<textarea id="ne-'+key+'-'+ci+'" class="edit-only hidden" rows="2" style="margin-top:6px;">'+notes+'</textarea>';
    html += '<button class="edit-only btn" style="background:#f59e0b;color:white;font-size:12px;margin-top:6px;" onclick="editNotes(\''+key+'\','+ci+')">✏️ Notes</button>';
    html += '<button id="ns-'+key+'-'+ci+'" class="edit-only btn hidden" style="background:#16a34a;color:white;font-size:12px;margin-top:6px;" onclick="saveNotesUI(\''+key+'\','+ci+')">💾 સાચવો</button>';
    html += '</div>';

    html += '<div style="margin-top:16px;padding:16px;background:linear-gradient(90deg,#4f46e5,#7c3aed);border-radius:14px;text-align:center;color:white;">';
    html += '<h4 style="margin-bottom:4px;">📝 25 Marks Test</h4>';
    html += '<p style="font-size:12px;opacity:0.9;margin-bottom:10px;">25 પ્રશ્ન × 1 ગુણ • Confetti</p>';
    html += '<button class="btn" style="background:white;color:#4f46e5;font-weight:700;" onclick="startTest(\''+key+'\','+ci+')">Test શરૂ કરો →</button>';
    html += '</div></div></div>';
  });
  document.getElementById("dynamicArea").innerHTML = html;
}

function renderKey() {
  let html = '<h2 style="font-size:20px;font-weight:700;color:#059669;margin-bottom:16px;">🔑 Answer Key – ધોરણ '+currentStd+'</h2>';
  ["sci","math"].forEach(function(sub) {
    const k = currentStd + "-" + sub;
    const sec = data[k];
    if (!sec) return;
    html += '<h3 style="color:#4f46e5;margin:16px 0 8px;">'+sec.title+'</h3>';
    sec.chapters.forEach(function(ch) {
      html += '<div class="card" style="padding:12px;margin-bottom:10px;"><b>'+ch.name+'</b><ol style="margin:8px 0 0 18px;font-size:13px;">';
      (ch.questions||[]).forEach(function(q) {
        html += '<li style="margin-bottom:8px;"><span style="color:#64748b;">'+q.text.substring(0,60)+(q.text.length>60?"...":"")+'</span><div class="answer-box">'+(q.answer||"—")+'</div></li>';
      });
      html += '</ol></div>';
    });
  });
  document.getElementById("dynamicArea").innerHTML = html;
}

function toggleChap(el) {
  const body = el.nextElementSibling;
  body.classList.toggle("hidden");
  el.querySelector("span:last-child").textContent = body.classList.contains("hidden") ? "▼" : "▲";
}
function editNotes(key, ci) {
  document.getElementById("nv-"+key+"-"+ci).classList.add("hidden");
  document.getElementById("ne-"+key+"-"+ci).classList.remove("hidden");
  document.getElementById("ns-"+key+"-"+ci).classList.remove("hidden");
}
function saveNotesUI(key, ci) {
  const t = document.getElementById("ne-"+key+"-"+ci).value;
  saveNotes(key, ci, t);
  document.getElementById("nv-"+key+"-"+ci).textContent = t || "નોંધ નથી";
  document.getElementById("nv-"+key+"-"+ci).classList.remove("hidden");
  document.getElementById("ne-"+key+"-"+ci).classList.add("hidden");
  document.getElementById("ns-"+key+"-"+ci).classList.add("hidden");
}
function editQ(key, ci, qi) {
  if (!isUnlocked) return;
  editingIndex = {key, ci, qi};
  const q = data[key].chapters[ci].questions[qi];
  document.getElementById("modalTitle").textContent = "✏️ એડિટ";
  document.getElementById("newChap").value = data[key].chapters[ci].name;
  document.getElementById("newType").value = q.type;
  document.getElementById("newText").value = q.text;
  document.getElementById("newAnswer").value = q.answer || "";
  document.getElementById("addModal").classList.remove("hidden");
}
function delQ(key, ci, qi) {
  if (!isUnlocked) return;
  if (confirm("કાઢી નાખવો?")) {
    data[key].chapters[ci].questions.splice(qi, 1);
    saveData();
    render();
  }
}
function openAddModal() {
  if (!isUnlocked) { alert("હેડર પર 5 વાર ટચ કરી પાસવર્ડ નાખો"); return; }
  editingIndex = null;
  document.getElementById("modalTitle").textContent = "➕ નવો પ્રશ્ન";
  document.getElementById("newChap").value = "";
  document.getElementById("newText").value = "";
  document.getElementById("newAnswer").value = "";
  document.getElementById("addModal").classList.remove("hidden");
}
function closeAddModal() {
  document.getElementById("addModal").classList.add("hidden");
  editingIndex = null;
}
function saveQuestion() {
  if (!isUnlocked) return;
  const chap = document.getElementById("newChap").value.trim() || "નવું પ્રકરણ";
  const type = document.getElementById("newType").value;
  const text = document.getElementById("newText").value.trim();
  const ans = document.getElementById("newAnswer").value.trim();
  if (!text) { alert("પ્રશ્ન લખો"); return; }
  if (editingIndex) {
    const {key, ci, qi} = editingIndex;
    data[key].chapters[ci].questions[qi] = {type, text, answer: ans};
    data[key].chapters[ci].name = chap;
  } else {
    const key = currentStd + "-" + (currentSub === "key" ? "sci" : currentSub);
    if (!data[key]) data[key] = {title:"નવું", chapters:[]};
    let ch = data[key].chapters.find(c => c.name === chap);
    if (!ch) { ch = {name: chap, questions: [], notes: ""}; data[key].chapters.push(ch); }
    ch.questions.push({type, text, answer: ans});
  }
  saveData();
  closeAddModal();
  render();
}

document.querySelectorAll(".tab").forEach(function(t) {
  t.onclick = function() {
    document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("active"); });
    t.classList.add("active");
    currentStd = t.getAttribute("data-std");
    render();
  };
});
document.querySelectorAll(".subtab").forEach(function(t) {
  t.onclick = function() {
    document.querySelectorAll(".subtab").forEach(function(x){ x.classList.remove("active"); });
    t.classList.add("active");
    currentSub = t.getAttribute("data-sub");
    render();
  };
});

loadAll();
render();
</script>
</body>
</html>
